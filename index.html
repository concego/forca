<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forca Inclusiva</title>
    <style>
        :root { --bg: #121212; --txt: #fff; --accent: #00e5ff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .hidden { display: none !important; }
        .btn { background: #2a2a2a; color: #fff; padding: 15px; border: none; border-radius: 8px; margin: 5px; cursor: pointer; font-size: 1.1rem; }
        #visual-area { width: 150px; height: 200px; border-bottom: 3px solid #fff; position: relative; margin: 20px; }
        .g-up { position: absolute; background: #8d6e63; width: 4px; height: 180px; bottom: 0; left: 10px; }
        .g-top { position: absolute; background: #8d6e63; width: 80px; height: 4px; top: 0; left: 10px; }
        .g-rope { position: absolute; background: #ffa726; width: 2px; height: 25px; top: 0; right: 20px; }
        .part { position: absolute; background: #fff; display: none; }
        .head { width: 30px; height: 30px; border: 3px solid #fff; border-radius: 50%; top: 25px; right: 4px; }
        .body { width: 3px; height: 60px; top: 58px; right: 18px; }
        .arm-l { width: 25px; height: 3px; top: 75px; right: 21px; transform: rotate(-30deg); }
        .arm-r { width: 25px; height: 3px; top: 75px; right: -6px; transform: rotate(30deg); }
        .leg-l { width: 25px; height: 3px; top: 130px; right: 21px; transform: rotate(-45deg); }
        .leg-r { width: 25px; height: 3px; top: 130px; right: -6px; transform: rotate(45deg); }
        .visible { display: block; }
        #word-display { font-size: 2.2rem; letter-spacing: 5px; margin: 20px; font-family: monospace; }
        #status { font-size: 1.2rem; margin: 10px; color: var(--accent); min-height: 1.5em; }
    </style>
</head>
<body>
    <div id="setup">
        <h1>Forca Inclusiva</h1>
        <div style="margin-bottom: 20px;">
            <button class="btn" onclick="setLang('pt')">Português</button>
            <button class="btn" onclick="setLang('en')">English</button>
        </div>
        <div id="cats" class="hidden"></div>
    </div>
    <div id="game" class="hidden">
        <div id="visual-area" aria-hidden="true">
            <div class="g-up"></div><div class="g-top"></div><div class="g-rope"></div>
            <div id="p0" class="part head"></div><div id="p1" class="part body"></div>
            <div id="p2" class="part arm-l"></div><div id="p3" class="part arm-r"></div>
            <div id="p4" class="part leg-l"></div><div id="p5" class="part leg-r"></div>
        </div>
        <div id="status" role="status" aria-live="polite"></div>
        <div id="word-display" aria-label="Palavra"></div>
        <input type="text" id="input" maxlength="1" style="opacity:0; position:absolute; pointer-events:none;">
        <div id="controls">
            <button class="btn" onclick="document.getElementById('input').focus()">Letra / Letter</button>
            <button class="btn" style="background:#ff5252" onclick="guessFullWord()">Chutar / Guess</button>
        </div>
    </div>
    <script>
        const words = {
            pt: { artes: ["PINTURA", "TEATRO", "MUSICA"], historia: ["GUERRA", "IMPERIO"], ciencia: ["ATOMO", "GALAXIA"] },
            en: { arts: ["PAINTING", "THEATER", "MUSIC"], history: ["WAR", "EMPIRE"], science: ["ATOM", "GALAXY"] }
        };
        let lang = 'pt', currentWord = '', displayWord = [], errors = 0;
        function setLang(l) {
            lang = l;
            document.querySelector('#setup h1').textContent = lang === 'pt' ? 'Escolha a Categoria' : 'Choose Category';
            const catDiv = document.getElementById('cats');
            catDiv.innerHTML = '';
            Object.keys(words[lang]).forEach(cat => {
                const b = document.createElement('button');
                b.className = 'btn';
                b.textContent = cat;
                b.onclick = () => startGame(cat);
                catDiv.appendChild(b);
            });
            catDiv.classList.remove('hidden');
        }
        function startGame(cat) {
            currentWord = words[lang][cat][Math.floor(Math.random() * words[lang][cat].length)];
            displayWord = Array(currentWord.length).fill('_');
            errors = 0;
            document.getElementById('setup').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            update();
        }
        function update(msg = '') {
            document.getElementById('word-display').textContent = displayWord.join(' ');
            document.getElementById('status').textContent = msg || (lang === 'pt' ? `Erros: ${errors}/6` : `Errors: ${errors}/6`);
            for(let i=0; i<6; i++) document.getElementById(`p${i}`).classList.toggle('visible', i < errors);
        }
        document.getElementById('input').addEventListener('input', e => {
            const l = e.target.value.toUpperCase(); e.target.value = '';
            if (!l || !/^[A-Z]$/.test(l)) return;
            if (currentWord.includes(l)) {
                for(let i=0; i<currentWord.length; i++) if(currentWord[i] === l) displayWord[i] = l;
                if (!displayWord.includes('_')) { update(lang==='pt'?'Venceu!':'Won!'); setTimeout(()=>location.reload(), 2000); }
            } else {
                errors++;
                if (errors >= 6) { update('Game Over! ' + currentWord); setTimeout(()=>location.reload(), 3000); }
                else update(lang === 'pt' ? 'Errou!' : 'Wrong!');
            }
        });
        function guessFullWord() {
            const g = prompt(lang === 'pt' ? 'Qual a palavra?' : 'What is the word?');
            if (g && g.toUpperCase() === currentWord) { displayWord = currentWord.split(''); update('Win!'); setTimeout(()=>location.reload(), 2000); }
            else if (g) { errors = 6; update('Lose! ' + currentWord); setTimeout(()=>location.reload(), 3000); }
        }
    </script>
</body>
</html>
