<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forca Inclusiva - Eu Concego Jogar</title>
    <style>
        :root { --bg: #121212; --txt: #ffffff; --accent: #00e5ff; --panel: #1e1e1e; --risk: #ff5252; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--txt); display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        h1 { margin-bottom: 10px; color: var(--accent); }
        .hidden { display: none !important; }
        .container { background: var(--panel); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 500px; text-align: center; }
        .btn { background: #333; color: #fff; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; margin: 8px; font-size: 1rem; transition: background 0.3s, transform 0.1s; }
        .btn:hover { background: #444; }
        .btn:focus { outline: 3px solid var(--accent); transform: scale(1.05); }
        .risk-btn { background: #b71c1c; font-weight: bold; }
        .risk-btn:hover { background: #d32f2f; }

        #visual-area { width: 180px; height: 220px; border-bottom: 5px solid #fff; position: relative; margin: 20px auto; }
        .g-up { position: absolute; background: #8d6e63; width: 6px; height: 200px; bottom: 0; left: 20px; }
        .g-top { position: absolute; background: #8d6e63; width: 100px; height: 6px; top: 0; left: 20px; }
        .g-rope { position: absolute; background: #ffa726; width: 3px; height: 30px; top: 0; right: 25px; }
        
        .part { position: absolute; background: #fff; display: none; }
        .head { width: 40px; height: 40px; border: 4px solid #fff; border-radius: 50%; top: 30px; right: 5px; }
        .body-p { width: 5px; height: 70px; top: 78px; right: 23px; }
        .arm-l { width: 40px; height: 4px; top: 95px; right: 28px; transform: rotate(-30deg); transform-origin: right; }
        .arm-r { width: 40px; height: 4px; top: 95px; left: 152px; transform: rotate(30deg); transform-origin: left; }
        .leg-l { width: 40px; height: 4px; top: 145px; right: 28px; transform: rotate(-45deg); transform-origin: right; }
        .leg-r { width: 40px; height: 4px; top: 145px; left: 152px; transform: rotate(45deg); transform-origin: left; }
        .visible { display: block; }
        
        #word-display { font-size: 2.5rem; letter-spacing: 8px; margin: 25px 0; font-family: 'Courier New', Courier, monospace; min-height: 3rem; word-break: break-all; }
        #status-msg { font-size: 1.2rem; color: var(--accent); margin: 15px 0; min-height: 1.5em; font-weight: bold; }
        #input-field { opacity: 0; position: absolute; pointer-events: none; }
        .diff-tag { font-size: 0.9rem; padding: 4px 8px; border-radius: 4px; background: #444; margin-bottom: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div id="screen-setup" class="container">
        <h1 id="setup-title">Forca Inclusiva</h1>
        <div id="lang-selection">
            <button class="btn" onclick="initMenu('pt')">Português</button>
            <button class="btn" onclick="initMenu('en')">English</button>
        </div>
        <div id="difficulty-selection" class="hidden">
            <p id="diff-label"></p>
            <button class="btn" id="btn-easy" onclick="setDiff(1)"></button>
            <button class="btn" id="btn-medium" onclick="setDiff(2)"></button>
            <button class="btn" id="btn-hard" onclick="setDiff(3)"></button>
        </div>
        <div id="category-selection" class="hidden">
            <p id="cat-label"></p>
            <div id="cat-btns"></div>
        </div>
    </div>

    <div id="screen-game" class="container hidden">
        <div class="diff-tag" id="game-info"></div>
        <div id="visual-area" aria-hidden="true">
            <div class="g-up"></div><div class="g-top"></div><div class="g-rope"></div>
            <div id="p0" class="part head"></div><div id="p1" class="part body-p"></div>
            <div id="p2" class="part arm-l"></div><div id="p3" class="part arm-r"></div>
            <div id="p4" class="part leg-l"></div><div id="p5" class="part leg-r"></div>
        </div>
        <div id="status-msg" role="status" aria-live="polite"></div>
        <!-- Word display agora é focável para facilitar a leitura com leitor de tela -->
        <div id="word-display" aria-label="Palavra" tabindex="0"></div>
        <input type="text" id="input-field" maxlength="1" autocomplete="off">
        <div id="game-controls">
            <button class="btn" id="btn-letter" onclick="focusInput()"></button>
            <button class="btn risk-btn" id="btn-guess" onclick="guessFull()"></button>
            <button class="btn" id="btn-scan" onclick="scanWord()" style="background:#006064"></button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep(freq, dur, type='sine', startTime=0) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime + startTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + startTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime + startTime); osc.stop(audioCtx.currentTime + startTime + dur);
        }

        const data = {
            pt: {
                labels: { title: "Escolha a Dificuldade", diff: "Nível de Dificuldade", easy: "Fácil", medium: "Médio", hard: "Difícil", cat: "Escolha a Categoria", letter: "Letra", guess: "Chutar Palavra", scan: "Ouvir Palavra", win: "VENCEU!", lose: "FIM DE JOGO: ", wrong: "Errou!", prompt: "Chute a palavra (ERRO = FIM):", errors: "Erros: " },
                cats: {
                    artes: { 1:["PINCEL","TELA"], 2:["ESCULTURA","MOSAICO"], 3:["SURREALISMO","BARROCO"] },
                    historia: { 1:["REI","GUERRA"], 2:["IMPERIO","COLONIA"], 3:["ILUMINISMO","RENASCENCA"] },
                    geografia: { 1:["BRASIL","MAPA"], 2:["PLANALTO","OCEANO"], 3:["ARQUIPELAGO","MERIDIANO"] },
                    ciencia: { 1:["ATOMO","LUA"], 2:["CELULA","PLANETA"], 3:["GENETICA","EVOLUCAO"] },
                    animais: { 1:["GATO","LEAO"], 2:["GIRAFA","BALEIA"], 3:["ORNITORRINCO","CAMALEAO"] },
                    esportes: { 1:["BOLA","GOL"], 2:["BASQUETE","NATACAO"], 3:["ATLETISMO","JUDO"] }
                }
            },
            en: {
                labels: { title: "Choose Difficulty", diff: "Difficulty Level", easy: "Easy", medium: "Medium", hard: "Hard", cat: "Choose Category", letter: "Letter", guess: "Guess Word", scan: "Scan Word", win: "YOU WON!", lose: "GAME OVER: ", wrong: "Wrong!", prompt: "Guess the word (WRONG = LOSE):", errors: "Errors: " },
                cats: {
                    arts: { 1:["BRUSH","CANVAS"], 2:["SCULPTURE","MOSAIC"], 3:["SURREALISM","BAROQUE"] },
                    history: { 1:["KING","WAR"], 2:["EMPIRE","COLONY"], 3:["ENLIGHTENMENT","RENAISSANCE"] },
                    geography: { 1:["MAP","WORLD"], 2:["PLATEAU","OCEAN"], 3:["ARCHIPELAGO","MERIDIAN"] },
                    science: { 1:["ATOM","MOON"], 2:["CELL","PLANET"], 3:["GENETICS","EVOLUTION"] },
                    animals: { 1:["CAT","LION"], 2:["GIRAFFE","WHALE"], 3:["PLATYPUS","CHAMELEON"] },
                    sports: { 1:["BALL","GOAL"], 2:["BASKETBALL","SWIMMING"], 3:["ATHLETICS","JUDO"] }
                }
            }
        };

        let lang = 'pt', diff = 1, currentWord = '', displayWord = [], errors = 0;

        function initMenu(l) {
            lang = l; beep(440, 0.1);
            const lb = data[lang].labels;
            document.getElementById('setup-title').textContent = lb.title;
            document.getElementById('diff-label').textContent = lb.diff;
            document.getElementById('btn-easy').textContent = lb.easy;
            document.getElementById('btn-medium').textContent = lb.medium;
            document.getElementById('btn-hard').textContent = lb.hard;
            document.getElementById('lang-selection').classList.add('hidden');
            document.getElementById('difficulty-selection').classList.remove('hidden');
        }

        function setDiff(d) {
            diff = d; beep(550, 0.1);
            document.getElementById('difficulty-selection').classList.add('hidden');
            document.getElementById('cat-label').textContent = data[lang].labels.cat;
            const btns = document.getElementById('cat-btns');
            btns.innerHTML = '';
            Object.keys(data[lang].cats).forEach(cat => {
                const b = document.createElement('button');
                b.className = 'btn'; b.textContent = cat.toUpperCase();
                b.onclick = () => startGame(cat);
                btns.appendChild(b);
            });
            document.getElementById('category-selection').classList.remove('hidden');
        }

        function startGame(cat) {
            const list = data[lang].cats[cat][diff];
            currentWord = list[Math.floor(Math.random() * list.length)];
            displayWord = Array(currentWord.length).fill('.');
            errors = 0;
            document.getElementById('screen-setup').classList.add('hidden');
            document.getElementById('screen-game').classList.remove('hidden');
            const lb = data[lang].labels;
            const diffName = diff==1?lb.easy:diff==2?lb.medium:lb.hard;
            document.getElementById('game-info').textContent = `${cat.toUpperCase()} | ${diffName.toUpperCase()}`;
            document.getElementById('btn-letter').textContent = lb.letter;
            document.getElementById('btn-guess').textContent = lb.guess;
            document.getElementById('btn-scan').textContent = lb.scan;
            update();
            scanWord();
            // Focamos no display da palavra para o leitor de tela ler o estado inicial
            setTimeout(() => document.getElementById('word-display').focus(), 1000);
        }

        function scanWord() {
            displayWord.forEach((char, i) => {
                const freq = (char === '.') ? 330 : 660; 
                // Aumentado o intervalo de 0.2 para 0.4 e duração para 0.25 para ficar mais calmo
                beep(freq, 0.25, 'sine', i * 0.4);
            });
        }

        function focusInput() { 
            // Limpamos o campo antes de focar
            document.getElementById('input-field').value = '';
            document.getElementById('input-field').focus(); 
        }

        function update(msg = '') {
            document.getElementById('word-display').textContent = displayWord.join('');
            const lb = data[lang].labels;
            document.getElementById('status-msg').textContent = msg || (lb.errors + errors + "/6");
            for(let i=0; i<6; i++) document.getElementById(`p${i}`).classList.toggle('visible', i < errors);
        }

        document.getElementById('input-field').addEventListener('input', e => {
            const char = e.target.value.toUpperCase(); e.target.value = '';
            if (!char.match(/[A-Z]/)) return;
            if (currentWord.includes(char)) {
                beep(880, 0.1);
                for(let i=0; i<currentWord.length; i++) if(currentWord[i] === char) displayWord[i] = char;
                if (!displayWord.includes('.')) win(); 
                else {
                    update();
                    scanWord();
                    // Após acertar, focamos na palavra para o usuário ouvir o novo estado
                    setTimeout(() => document.getElementById('word-display').focus(), 500);
                }
            } else {
                errors++; beep(220, 0.2, 'sawtooth');
                if (errors >= 6) lose(); else {
                    update(data[lang].labels.wrong);
                    // Se errou, volta o foco para o botão de letra para facilitar nova tentativa
                    setTimeout(() => document.getElementById('btn-letter').focus(), 500);
                }
            }
        });

        function guessFull() {
            const guess = prompt(data[lang].labels.prompt);
            if (!guess) return;
            if (guess.toUpperCase() === currentWord) {
                displayWord = currentWord.split(''); win();
            } else {
                errors = 6; lose();
            }
        }

        function win() {
            beep(523, 0.1); setTimeout(()=>beep(659, 0.1), 100); setTimeout(()=>beep(784, 0.3), 200);
            update(data[lang].labels.win);
            setTimeout(()=>location.reload(), 3000);
        }

        function lose() {
            beep(150, 0.5, 'square');
            update(data[lang].labels.lose + currentWord);
            setTimeout(()=>location.reload(), 4000);
        }
    </script>
</body>
</html>
